<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil - Panel</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="app-body">
    <div class="app">
        <aside class="sidebar">
            <div class="brand">Mi App SENA</div>
            <nav>
                <a class="nav-link" href="dashboard.html">Inicio</a>
                <a class="nav-link active" href="perfil.html">Perfil</a>
                <a class="nav-link" href="productos.html">Productos</a>
            </nav>
            <div class="sidebar-foot">
                <div class="user-info">
                    <span id="user-avatar" class="avatar">N</span>
                    <div>
                        <strong data-user-name>Usuario</strong>
                        <small data-user-email>-</small>
                    </div>
                </div>
                <button type="button" id="btn-logout" class="btn-logout">Cerrar sesión</button>
            </div>
        </aside>

        <div class="content">
            <header class="content-header">
                <div>
                    <p class="eyebrow">CONFIGURACIÓN</p>
                    <h1>Perfil de Usuario</h1>
                </div>
            </header>

            <section class="card">
                <h2>Información de la Cuenta</h2>
                <div class="profile-details">
                    <p><strong>Correo electrónico:</strong> <span data-user-email>-</span></p>
                    <p><strong>ID de Usuario (UID):</strong> <span id="user-id">-</span></p>
                    <p><strong>Programa:</strong> Análisis y Desarrollo de Software (ADSO)</p>
                    <p><strong>Ficha:</strong> 3230905</p>
                </div>
            </section>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/guard.js"></script>
</body>
</html>
